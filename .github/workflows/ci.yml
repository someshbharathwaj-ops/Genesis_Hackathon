name: Recall CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-typecheck:
    name: Backend Static Analysis & Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff Lint
        run: |
          cd backend
          ruff check app tests

      - name: Run Mypy Type Checking
        run: |
          cd backend
          mypy app tests

  backend-tests:
    name: Backend Test Suite (Unit, Contract, Integration, Negative)
    runs-on: ubuntu-latest
    needs: backend-lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Pytest Suite with Coverage
        run: |
          cd backend
          pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend-typecheck-and-lint:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Build Next.js app
        run: |
          cd frontend
          npm run build
